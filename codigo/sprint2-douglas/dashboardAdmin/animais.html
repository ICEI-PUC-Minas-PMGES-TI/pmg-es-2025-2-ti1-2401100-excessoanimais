<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoonoses Admin — Animais</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="animais">
  <div class="container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo"><img src="../../public/assets/images/logo.png" alt="Logo"></div>
        <h2>Zoonoses Admin</h2>
      </div>
      <nav>
        <ul>
          <li data-link="dashboard">🏠 Dashboard</li>
          <li data-link="denuncias">📋 Denúncias</li>
          <li class="active" data-link="animais">🐾 Animais</li>
        </ul>
      </nav>
      <div class="logout"><a href="#">↩️ Sair</a></div>
    </aside>

    <main class="main-content">
      <header class="header">
        <button id="menu-toggle" class="menu-toggle">☰</button>
        <h1>Animais</h1>
        <div class="user-info"><span>Admin</span><div class="user-icon"></div></div>
      </header>

      <div class="toolbar">
        <div class="filters">
          <input id="search-animal" placeholder="Pesquisar por nome ou espécie" />
          <select id="filter-status">
            <option value="">Todos os status</option>
            <option value="Vacinado">Disponível</option>
            <option value="Adotado">Adotado</option>
            <option value="Resgatado">Resgatado</option>
          </select>
        </div>
        <button id="btn-add-animal" class="btn primary">+ Adicionar Animal</button>
      </div>

      <section class="animais-list">
        <!-- tabela desktop -->
        <div class="table-container">
          <table id="tabela-animais">
            <thead><tr><th>Foto</th><th>Nome</th><th>Espécie</th><th>Idade</th><th>Porte</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <!-- cards mobile (rendered by JS when narrow) -->
        <div id="animais-cards" class="cards-grid"></div>
      </section>
    </main>
  </div>

  <!-- Modal: Adicionar / Editar Animal -->
  <div id="modal-animal" class="modal">
    <div class="modal-content">
      <h3 id="modal-animal-title">Adicionar Animal</h3>
      <form id="form-animal">
        <input type="hidden" id="animal-id">
        <label>Nome <input id="animal-nome" required></label>
        <label>Espécie
          <select id="animal-especie" required>
            <option value="Cão">Cão</option>
            <option value="Gato">Gato</option>
            <option value="Outro">Outro</option>
          </select>
        </label>
        <label>Idade
          <select id="animal-idade">
            <option>Filhote</option><option>Jovem</option><option>Adulto</option><option>Idoso</option>
          </select>
        </label>
        <label>Porte
          <select id="animal-porte">
            <option>Pequeno</option><option>Médio</option><option>Grande</option>
          </select>
        </label>
        <label>Status
          <select id="animal-status">
            <option>Vacinado</option><option>Adotado</option><option>Resgatado</option><option>Em Tratamento</option>
          </select>
        </label>
        <label>Cor <input id="animal-cor"></label>
        <label>Imagem (URL) <input id="animal-imagem" placeholder="https://..."></label>
        <label>Descrição <textarea id="animal-descricao" rows="3"></textarea></label>

        <div class="modal-actions">
          <button type="button" class="btn" id="modal-close">Cancelar</button>
          <button type="submit" class="btn primary" id="modal-save">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
