<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoonoses Admin — Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="dashboard">
  <div class="container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="../../public/assets/images/logo.png" alt="Logo ZooPet">
        </div>
        <h2>Zoonoses Admin</h2>
      </div>
      <nav>
        <ul>
          <li class="active" data-link="dashboard">🏠 Dashboard</li>
          <li data-link="denuncias">📋 Denúncias</li>
          <li data-link="animais">🐾 Animais</li>
        </ul>
      </nav>
      <div class="logout"><a href="#">↩️ Sair</a></div>
    </aside>

    <main class="main-content">
      <header class="header">
        <button id="menu-toggle" class="menu-toggle">☰</button>
        <h1>Dashboard</h1>
        <div class="user-info"><span>Admin</span><div class="user-icon"></div></div>
      </header>

      <section class="cards">
        <div class="card blue"><p>Total de Denúncias</p><h2 id="total-denuncias">--</h2></div>
        <div class="card orange"><p>Animais para Adoção</p><h2 id="animais-adocao">--</h2></div>
        <div class="card green"><p>Adoções Concluídas</p><h2 id="adocoes-concluidas">--</h2></div>
        <div class="card purple"><p>Resgates em Andamento</p><h2 id="resgates-andamento">--</h2></div>
      </section>

      <section class="ultimas-denuncias">
        <h2>Últimas Denúncias</h2>
        <div class="table-container">
          <table id="tabela-denuncias">
            <thead><tr><th>Endereço</th><th>Tipo</th><th>Condição</th><th>Data</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="alertas">
        <h2>Alertas Importantes</h2>
        <div id="alertas-container"></div>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
