<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoonoses Admin — Denúncias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="denuncias">
  <div class="container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo"><img src="../../public/assets/images/logo.png" alt="Logo"></div>
        <h2>Zoonoses Admin</h2>
      </div>
      <nav>
        <ul>
          <li data-link="dashboard">🏠 Dashboard</li>
          <li class="active" data-link="denuncias">📋 Denúncias</li>
          <li data-link="animais">🐾 Animais</li>
        </ul>
      </nav>
      <div class="logout"><a href="#">↩️ Sair</a></div>
    </aside>

    <main class="main-content">
      <header class="header">
        <button id="menu-toggle" class="menu-toggle">☰</button>
        <h1>Denúncias</h1>
        <div class="user-info"><span>Admin</span><div class="user-icon"></div></div>
      </header>

      <div class="toolbar">
        <div class="filters">
          <input id="search-denuncia" placeholder="Pesquisar por endereço, nome ou telefone" />
          <select id="filter-denuncia-status">
            <option value="">Todos os status</option>
            <option value="Pendente">Pendente</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Concluído">Concluído</option>
          </select>
        </div>
      </div>

      <section class="denuncias-list">
        <div class="table-container">
          <table id="tabela-denuncias-admin">
            <thead><tr><th>Protocolo</th><th>Endereço</th><th>Tipo</th><th>Condição</th><th>Contato</th><th>Data</th><th>Ações</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal: Ver/Editar Denúncia -->
  <div id="modal-denuncia" class="modal">
    <div class="modal-content">
      <h3>Detalhes da Denúncia</h3>
      <div id="detalhes-denuncia"></div>

      <form id="form-denuncia-status">
        <label>Status
          <select id="denuncia-status">
            <option>Pendente</option>
            <option>Em Andamento</option>
            <option>Concluído</option>
          </select>
        </label>

        <div class="modal-actions">
          <button type="button" class="btn" id="modal-denuncia-close">Fechar</button>
          <button type="submit" class="btn primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
