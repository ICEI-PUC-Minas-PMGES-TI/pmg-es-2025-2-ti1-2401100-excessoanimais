<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZooPet — Cadastro</title>
  
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/auth.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <a class="voltar" href="./login.html">← Voltar ao login</a>

  <div class="fundo-escuro">
    <img src="../../assets/images/backgroundLoginImg.png" alt="Imagem de fundo" class="imagem-fundo">
  </div>

  <div class="centro">
    <div class="caixa-login">
      <div class="logo">
        <img src="../../assets/images/logo.png" alt="Logo ZooPet">
        <h1>ZooPet</h1>
      </div>

      <h2>Crie sua conta</h2>

      <form id="form-cadastro">
        <label for="tipoUsuario">Tipo de Usuário</label>
        <div class="campo">
          <select id="tipoUsuario" required>
            <option value="comum">Usuário Comum</option>
            <option value="zoonoses">Zoonoses / Protetor</option>
          </select>
        </div>

        <label for="nome">Nome completo</label>
        <div class="campo">
          <input id="nome" type="text" placeholder="Seu nome completo" required>
        </div>

        <label for="email">E-mail</label>
        <div class="campo">
          <input id="email" type="email" placeholder="seu@email.com" required>
        </div>

        <label for="senha">Senha</label>
        <div class="campo">
          <input id="senha" type="password" placeholder="Crie uma senha" required>
        </div>

        <label for="telefone">Telefone</label>
        <div class="campo">
          <input id="telefone" type="tel" placeholder="(00) 00000-0000">
        </div>

        <div class="botao-centro">
          <button class="botao" type="submit">Cadastrar</button>
        </div>

        <div class="links">
          <p>Já tem uma conta? <a href="./login.html">Entrar</a></p>
        </div>
      </form>

      <p id="mensagem" class="mensagem"></p>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script>
    const form = document.getElementById('form-cadastro');
    const msg = document.getElementById('mensagem');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = 'Processando...';
        msg.className = 'mensagem';

        const novoUsuario = {
            tipoUsuario: document.getElementById('tipoUsuario').value,
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
            telefone: document.getElementById('telefone').value,
            animaisAdotados: [],
            animaisCurtidos: [],
            denunciasFeitas: []
        };

        try {
            const usuariosExistentes = await window.api.get('/usuarios');
            const emailExiste = usuariosExistentes.some(u => u.email === novoUsuario.email);

            if (emailExiste) {
                msg.textContent = 'Este e-mail já está cadastrado.';
                msg.className = 'mensagem erro';
                return;
            }

            await window.api.post('/usuarios', novoUsuario);

            msg.textContent = 'Cadastro realizado com sucesso! Redirecionando...';
            msg.className = 'mensagem sucesso';

            setTimeout(() => {
                window.location.href = './login.html';
            }, 1500);

        } catch (error) {
            console.error(error);
            msg.textContent = 'Erro ao cadastrar. Tente novamente.';
            msg.className = 'mensagem erro';
        }
    });
  </script>
</body>
</html>
