<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Denúncias</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/images/logo.png" alt="Logo">
                <h3 style="margin-top: 10px;">Admin</h3>
            </div>
            <nav>
                <ul>
                    <li><a href="dashboard.html">📊 Dashboard</a></li>
                    <li class="active"><a href="denuncias.html">📢 Denúncias</a></li>
                    <li><a href="animais.html">🐾 Animais</a></li>
                </ul>
            </nav>
            <div class="logout"><a href="#" onclick="window.utils.logout()">🚪 Sair</a></div>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>Gerenciar Denúncias</h2>
                <select id="filtro-status" class="btn">
                    <option value="">Todos os Status</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Concluído">Concluído</option>
                </select>
            </header>

            <div class="table-container">
                <table id="tabela-denuncias">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Local</th>
                            <th>Animal</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modal-denuncia" class="modal">
        <div class="modal-content">
            <h3>Detalhes da Denúncia</h3>
            <div id="conteudo-modal" style="margin: 20px 0; line-height: 1.8;">
            </div>
            
            <hr>
            
            <form id="form-status" style="margin-top: 20px;">
                <label for="novo-status" style="font-weight: bold;">Atualizar Status:</label>
                <select id="novo-status" class="btn" style="width: 100%; border: 1px solid #ddd; margin-top: 10px;">
                    <option value="Pendente">Pendente</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Concluído">Concluído</option>
                </select>

                <div class="modal-actions">
                    <button type="button" class="btn" onclick="document.getElementById('modal-denuncia').style.display='none'">Fechar</button>
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        let denunciaAtualId = null;
        let todasDenuncias = [];

        document.addEventListener('DOMContentLoaded', carregarDenuncias);
        document.getElementById('filtro-status').addEventListener('change', renderizarTabela);

        async function carregarDenuncias() {
            todasDenuncias = await window.api.get('/denuncias');
            renderizarTabela();
        }

        function renderizarTabela() {
            const filtro = document.getElementById('filtro-status').value;
            const tbody = document.querySelector('#tabela-denuncias tbody');
            
            const filtradas = filtro 
                ? todasDenuncias.filter(d => d.status === filtro)
                : todasDenuncias;

            if (filtradas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Nenhuma denúncia encontrada.</td></tr>';
                return;
            }

            tbody.innerHTML = filtradas.map(d => {
                // Tratamento de segurança para status null/undefined
                const status = d.status || 'Pendente';
                const badgeClass = status.toLowerCase().replace(' ', ''); // pendente, emandamento, concluido

                return `
                <tr>
                    <td>#${d.id}</td>
                    <td>${d.endereco}</td>
                    <td>${d.tipo} <br><small style="color:#666">(${d.condicao})</small></td>
                    <td><span class="badge badge-${badgeClass}">${status}</span></td>
                    <td>
                        <!-- CORREÇÃO CRÍTICA: Aspas simples '${d.id}' em volta do ID -->
                        <button class="btn btn-primary" onclick="abrirModal('${d.id}')">Gerenciar</button>
                    </td>
                </tr>
            `}).join('');
        }

        window.abrirModal = (id) => {
            console.log("CLIQUE DETECTADO! Tentando abrir ID:", id); // Isso vai aparecer no console agora

            // Força ambos para String para garantir que "1" seja igual a 1
            const denuncia = todasDenuncias.find(d => String(d.id) === String(id));
            
            if(!denuncia) {
                console.error("ERRO: Denúncia não encontrada no array local. ID procurado:", id);
                console.log("IDs disponíveis:", todasDenuncias.map(d => d.id));
                return;
            }

            denunciaAtualId = denuncia.id;
            
            // Preenche modal com tratamento para campos vazios
            document.getElementById('conteudo-modal').innerHTML = `
                <p><strong>📍 Endereço:</strong> ${denuncia.endereco}</p>
                <p><strong>🏢 Referência:</strong> ${denuncia.referencia || 'Não informada'}</p>
                <p><strong>📝 Observações:</strong> ${denuncia.observacoes || 'Nenhuma'}</p>
                <hr style="margin: 10px 0; border: 0; border-top: 1px solid #eee;">
                <p><strong>👤 Denunciante:</strong> ${denuncia.nome}</p>
                <p><strong>📞 Telefone:</strong> ${denuncia.telefone}</p>
                <p><strong>📅 Data:</strong> ${denuncia.dataEnvio || 'Data não registrada'}</p>
            `;
            
            document.getElementById('novo-status').value = denuncia.status || 'Pendente';
            document.getElementById('modal-denuncia').style.display = 'flex';
        };

        document.getElementById('form-status').addEventListener('submit', async (e) => {
            e.preventDefault();
            const novoStatus = document.getElementById('novo-status').value;
            
            try {
                await window.api.update(`/denuncias/${denunciaAtualId}`, { status: novoStatus });
                
                const dIndex = todasDenuncias.findIndex(d => d.id === denunciaAtualId);
                if(dIndex >= 0) todasDenuncias[dIndex].status = novoStatus;
                
                renderizarTabela();
                document.getElementById('modal-denuncia').style.display = 'none';
                alert('Status atualizado com sucesso!');
            } catch (error) {
                alert('Erro ao atualizar status.');
            }
        });
    </script>
</body>
</html>
