<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoonoses Parceira - Denúncia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/denuncia.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div id="header-placeholder"></div>

    <header class="text-center py-4 mt-4">
        <h2 class="fw-bold" style="color: var(--primary-color);">🐾 Denunciar um Animal Abandonado</h2>
        <p class="text-muted">Preencha as informações abaixo para que possamos resgatar o animal com segurança</p>
    </header>

    <main class="container mb-5 flex-grow-1">
        <form id="formDenuncia" class="mx-auto p-4 bg-white rounded shadow-sm">
            
            <fieldset class="mb-4">
                <legend class="fw-semibold">📍 Onde está o animal?</legend>
                <div class="mb-3">
                    <label for="endereco" class="form-label">Endereço Completo *</label>
                    <input type="text" id="endereco" class="form-control" placeholder="Rua, número, bairro, cidade" required>
                </div>
                <div class="mb-3">
                    <label for="referencia" class="form-label">Ponto de Referência</label>
                    <input type="text" id="referencia" class="form-control" placeholder="Ex: Próximo à Padaria Central">
                </div>
            </fieldset>

            <fieldset class="mb-4">
                <legend class="fw-semibold">🐶 Sobre o animal</legend>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="tipo" class="form-label">Tipo de Animal *</label>
                        <select id="tipo" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option value="Cachorro">Cachorro</option>
                            <option value="Gato">Gato</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Porte *</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="porte" id="pequeno" value="Pequeno" required>
                            <label class="form-check-label" for="pequeno">Pequeno</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="porte" id="medio" value="Médio">
                            <label class="form-check-label" for="medio">Médio</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="porte" id="grande" value="Grande">
                            <label class="form-check-label" for="grande">Grande</label>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <label for="condicao" class="form-label">Condição do Animal *</label>
                    <select id="condicao" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option value="Ferido">Ferido</option>
                        <option value="Desnutrido">Desnutrido</option>
                        <option value="Agressivo">Agressivo</option>
                        <option value="Assustado">Assustado</option>
                        <option value="Saudavel">Saudável (Abandonado)</option>
                    </select>
                </div>

                <div class="mt-3">
                    <label for="observacoes" class="form-label">Observações</label>
                    <textarea id="observacoes" class="form-control" rows="3" placeholder="Descreva detalhes importantes..."></textarea>
                </div>
            </fieldset>

            <fieldset class="mb-4">
                <legend class="fw-semibold">👤 Seus dados (Sigiloso)</legend>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome Completo *</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone *</label>
                    <input type="tel" id="telefone" class="form-control" placeholder="(00) 00000-0000" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control">
                </div>
            </fieldset>

            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg px-5">Enviar Denúncia</button>
            </div>
        </form>

        <section id="listaDenuncias" class="mt-5 hidden">
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("formDenuncia");

            const user = JSON.parse(localStorage.getItem('usuarioLogado'));
            if (user) {
                if(document.getElementById("nome")) document.getElementById("nome").value = user.nome;
                if(document.getElementById("email")) document.getElementById("email").value = user.email;
                if(document.getElementById("telefone") && user.telefone) document.getElementById("telefone").value = user.telefone;
            }

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const denuncia = {
                    endereco: document.getElementById("endereco").value,
                    referencia: document.getElementById("referencia").value,
                    tipo: document.getElementById("tipo").value,
                    porte: document.querySelector('input[name="porte"]:checked')?.value || "",
                    condicao: document.getElementById("condicao").value,
                    observacoes: document.getElementById("observacoes").value,
                    nome: document.getElementById("nome").value,
                    telefone: document.getElementById("telefone").value,
                    email: document.getElementById("email").value,
                    status: "Pendente",
                    dataEnvio: new Date().toLocaleString("pt-BR")
                };

                try {
                    await window.api.post("/denuncias", denuncia);
                    
                    alert("✅ Denúncia enviada com sucesso! A Zoonoses foi notificada.");
                    form.reset();
                    
                    setTimeout(() => window.location.href = "../../../index.html", 1000);

                } catch (error) {
                    console.error(error);
                    alert("❌ Erro ao enviar denúncia. Verifique sua conexão.");
                }
            });
        });
    </script>
</body>
</html>
